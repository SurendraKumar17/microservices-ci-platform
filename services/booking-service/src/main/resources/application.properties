server.port=8080
spring.application.name=booking-service
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Expose all actuator endpoints including prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
# Add service name tag to all metrics
management.metrics.tags.service=booking-service
management.metrics.tags.env=${SPRING_PROFILES_ACTIVE:dev}

# ── Tracing ──────────────────────────────────────────────────────────────────
# Most OTel Java agent config below is set via environment variables (see
# Dockerfile / OTEL_* env vars), since the agent reads its config before the
# Spring context exists and can't rely on application.properties. Listed here
# for reference - the actual values that matter live in the Dockerfile/deploy
# manifest:
#   OTEL_SERVICE_NAME=booking-service
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.observability.svc.cluster.local:4317
#   OTEL_EXPORTER_OTLP_PROTOCOL=grpc
#   OTEL_TRACES_EXPORTER=otlp
#   OTEL_METRICS_EXPORTER=none
#   OTEL_LOGS_EXPORTER=none