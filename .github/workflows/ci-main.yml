name: Production Release Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/**'

  pull_request:
    branches:
      - main             #PR from release/** → main (or hotfix/** → main)
    paths:
      - 'gitops/**'

  workflow_dispatch:
    inputs:
      staging_sha:
        description: 'Staging SHA to promote (e.g. staging-a1b2c3d4)'
        required: true
        type: string
      release_notes:
        description: 'Brief release notes (shown in Slack notification)'
        required: true
        type: string
      services:
        description: 'Comma-separated services to promote (leave blank = all)'
        required: false
        default: 'book,frontend,search,user'
        type: string

permissions:
  id-token: write
  contents: write
  security-events: write

concurrency:
  group: production-deploy
  cancel-in-progress: false   # NEVER cancel an active prod deploy

env:
  AWS_REGION:    us-east-1
  ECR_REGISTRY:  ${{ secrets.ECR_REGISTRY }}
  ARGOCD_VERSION: v2.11.3

# ═══════════════════════════════════════════════════════════════════
#  PRODUCTION PIPELINE
#  ──────────────────────────────────────────────────────────────────
#  TRIGGER:  Manual workflow_dispatch only (never auto-trigger prod)
#
#  FLOW:
#    approval-gate
#      → validate-staging-sha          (confirm SHA exists + passed staging)
#      → retag-images                  (staging-{sha} → prod-{sha} + stable)
#      → gitops-update-prod            (update prod values.yaml)
#      → post-deploy-prod              (wait → smoke)
#          ↓ on smoke failure
#      → auto-rollback                 (revert gitops tag to previous stable)
#      → notify                        (Slack — success or failure)
#
#  RULES
#  - Build once in staging, promote the same artifact. Never rebuild.
#  - Only retag: staging-{sha} → prod-{sha} + stable
#  - Smoke failure = immediate auto-rollback, no human needed
#  - All other tests (integration, E2E, perf, ZAP) ran in staging — not repeated
#
#  OWNERSHIP
#  [DEVOPS OWNS]  All job wiring, ECR retag, ArgoCD sync, smoke, rollback, notify
#  [DEV OWNS]     services/{svc}/tests/smoke/ if custom smoke scripts added
# ═══════════════════════════════════════════════════════════════════

jobs:

  # ─────────────────────────────────────────────────────────────────
  # 0. APPROVAL GATE  [DEVOPS OWNS]
  #    Requires 2 reviewers configured under GitHub Environment:
  #    Settings → Environments → production → Required reviewers
  #    Add: Lead Dev + DevOps Lead (or your release manager)
  # ─────────────────────────────────────────────────────────────────
  approval-gate:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    environment:
      name: production          # GitHub env with required reviewers + wait timer
    steps:
      - name: Log approval
        run: |
          echo "✅ Production deployment approved"
          echo "  SHA to promote : ${{ github.event.inputs.staging_sha }}"
          echo "  Services       : ${{ github.event.inputs.services }}"
          echo "  Release notes  : ${{ github.event.inputs.release_notes }}"
          echo "  Approved by    : ${{ github.actor }}"
          echo "  Timestamp      : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  # ─────────────────────────────────────────────────────────────────
  # 1. VALIDATE STAGING SHA  [DEVOPS OWNS]
  #    Confirms the provided staging-{sha} tag exists in ECR
  #    and is not being promoted blindly (guards against typos)
  # ─────────────────────────────────────────────────────────────────
  validate-staging-sha:
    name: Validate Staging SHA exists in ECR
    runs-on: ubuntu-latest
    needs: [approval-gate]
    outputs:
      prod_tag:      ${{ steps.tags.outputs.prod_tag }}
      short_sha:     ${{ steps.tags.outputs.short_sha }}
      services_list: ${{ steps.tags.outputs.services_list }}
    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635457411372:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Derive tags
        id: tags
        run: |
          STAGING_TAG="${{ github.event.inputs.staging_sha }}"
          SHORT_SHA="${STAGING_TAG#staging-}"          # strip "staging-" prefix
          PROD_TAG="prod-${SHORT_SHA}"
          SERVICES="${{ github.event.inputs.services }}"

          echo "staging_tag=$STAGING_TAG"   >> $GITHUB_OUTPUT
          echo "prod_tag=$PROD_TAG"         >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA"       >> $GITHUB_OUTPUT
          echo "services_list=$SERVICES"    >> $GITHUB_OUTPUT

          echo "  Staging tag : $STAGING_TAG"
          echo "  Prod tag    : $PROD_TAG"
          echo "  Services    : $SERVICES"

      - name: Verify staging images exist in ECR
        run: |
          STAGING_TAG="${{ github.event.inputs.staging_sha }}"
          SERVICES="${{ github.event.inputs.services }}"

          IFS=',' read -ra SVC_ARRAY <<< "$SERVICES"
          MISSING=0

          for SVC in "${SVC_ARRAY[@]}"; do
            SVC=$(echo $SVC | xargs)   # trim whitespace
            echo -n "  Checking $SVC:$STAGING_TAG ... "
            EXISTS=$(aws ecr describe-images \
              --repository-name "$SVC" \
              --image-ids imageTag="$STAGING_TAG" \
              --query 'imageDetails[0].imageTags' \
              --output text 2>/dev/null || echo "NOT_FOUND")

            if [[ "$EXISTS" == "NOT_FOUND" || -z "$EXISTS" ]]; then
              echo "❌ NOT FOUND"
              MISSING=1
            else
              echo "✅ found"
            fi
          done

          if [[ "$MISSING" == "1" ]]; then
            echo ""
            echo "❌ One or more images not found in ECR for tag: $STAGING_TAG"
            echo "   Did this SHA pass the staging pipeline?"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # 2. RETAG IMAGES  [DEVOPS OWNS]
  #    staging-{sha} → prod-{sha}  +  stable
  #    No rebuild. Same bits that passed staging testing.
  # ─────────────────────────────────────────────────────────────────
  retag-images:
    name: Retag — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [validate-staging-sha]
    strategy:
      fail-fast: false
      matrix:
        service: [book, frontend, search, user]
    steps:
      - name: Skip if service not in promote list
        id: check
        run: |
          SERVICES="${{ needs.validate-staging-sha.outputs.services_list }}"
          SVC="${{ matrix.service }}"
          if echo "$SERVICES" | grep -qw "$SVC"; then
            echo "promote=true" >> $GITHUB_OUTPUT
          else
            echo "promote=false" >> $GITHUB_OUTPUT
            echo "  ↳ $SVC not in promote list — skipping"
          fi

      - name: Configure AWS (OIDC)
        if: steps.check.outputs.promote == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635457411372:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Retag image (staging → prod + stable)
        if: steps.check.outputs.promote == 'true'
        run: |
          STAGING_TAG="${{ github.event.inputs.staging_sha }}"
          PROD_TAG="${{ needs.validate-staging-sha.outputs.prod_tag }}"

          echo "  ${{ matrix.service }}: $STAGING_TAG → $PROD_TAG + stable"

          # Pull staging image manifest and push under prod tags
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${{ matrix.service }}" \
            --image-ids imageTag="$STAGING_TAG" \
            --query 'images[0].imageManifest' \
            --output text)

          # Tag as prod-{sha}
          aws ecr put-image \
            --repository-name "${{ matrix.service }}" \
            --image-tag "$PROD_TAG" \
            --image-manifest "$MANIFEST"

          # Tag as stable (mutable — always points to latest prod)
          aws ecr put-image \
            --repository-name "${{ matrix.service }}" \
            --image-tag "stable" \
            --image-manifest "$MANIFEST"

          echo "  ✅ ${{ matrix.service }} retagged → $PROD_TAG + stable"

  # ─────────────────────────────────────────────────────────────────
  # 3. SNAPSHOT CURRENT PROD TAG  [DEVOPS OWNS]
  #    Saves the current prod tag before we update gitops.
  #    Used by rollback job if smoke tests fail.
  # ─────────────────────────────────────────────────────────────────
  snapshot-current-prod:
    name: Snapshot current prod tags (rollback baseline)
    runs-on: ubuntu-latest
    needs: [validate-staging-sha]
    outputs:
      previous_tags: ${{ steps.snap.outputs.previous_tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Read current prod tags
        id: snap
        run: |
          FILE=gitops/environments/production/values.yaml
          TAGS=$(yq '{"book": .book.tag, "frontend": .frontend.tag, "search": .search.tag, "user": .user.tag}' \
            $FILE -o json)
          echo "previous_tags=$TAGS" >> $GITHUB_OUTPUT
          echo "  Current prod tags snapshot:"
          echo "$TAGS" | jq .

  # ─────────────────────────────────────────────────────────────────
  # 4. GITOPS UPDATE — PROD  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  gitops-update-prod:
    name: GitOps — update production image tags
    runs-on: ubuntu-latest
    needs: [retag-images, snapshot-current-prod, validate-staging-sha]
    if: |
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps values (production)
        run: |
          FILE=gitops/environments/production/values.yaml
          PROD_TAG="${{ needs.validate-staging-sha.outputs.prod_tag }}"
          SERVICES="${{ needs.validate-staging-sha.outputs.services_list }}"

          IFS=',' read -ra SVC_ARRAY <<< "$SERVICES"
          for SVC in "${SVC_ARRAY[@]}"; do
            SVC=$(echo $SVC | xargs)
            echo "  ↳ $SVC → $PROD_TAG"
            yq -i ".$SVC.tag = \"$PROD_TAG\"" $FILE
          done

      - name: Commit & Push
        run: |
          PROD_TAG="${{ needs.validate-staging-sha.outputs.prod_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/production/values.yaml
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "gitops(prod): promote ${{ github.event.inputs.staging_sha }} → $PROD_TAG [skip ci]"
          git pull --rebase origin main
          git push

  # ─────────────────────────────────────────────────────────────────
  # 5. POST-DEPLOY: PRODUCTION  [DEVOPS OWNS]
  #    Wait for ArgoCD sync → smoke tests only
  #    Integration/E2E/perf/ZAP already ran in staging — not repeated
  # ─────────────────────────────────────────────────────────────────
  post-deploy-prod:
    name: Production — post-deploy smoke tests
    runs-on: ubuntu-latest
    needs: [gitops-update-prod, validate-staging-sha]
    if: needs.gitops-update-prod.result == 'success'
    outputs:
      smoke_passed: ${{ steps.smoke.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache ArgoCD CLI
        id: cache-argocd
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/argocd
          key: argocd-${{ env.ARGOCD_VERSION }}

      - name: Install ArgoCD CLI
        if: steps.cache-argocd.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      # Uncomment when ArgoCD is wired up:
      # - name: Wait for ArgoCD sync (production)
      #   run: |
      #     argocd app wait bookstore-production \
      #       --health --timeout 600 \
      #       --server ${{ secrets.ARGOCD_SERVER }} \
      #       --auth-token ${{ secrets.ARGOCD_TOKEN }} \
      #       --insecure

      - name: Wait for services to be healthy
        run: |
          BASE=${{ secrets.PROD_URL }}
          wait_for() {
            local URL=$1
            local NAME=$2
            local RETRIES=18     # 3 min total (18 × 10s)
            local WAIT=10
            echo "  Waiting for $NAME..."
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
              if [[ "$STATUS" == "200" ]]; then
                echo "  ✅ $NAME is healthy ($STATUS)"
                return 0
              fi
              echo "  ⏳ $NAME not ready ($STATUS) — attempt $i/$RETRIES, retrying in ${WAIT}s..."
              sleep $WAIT
            done
            echo "  ❌ $NAME failed to become healthy after $((RETRIES * WAIT))s"
            return 1
          }
          wait_for "$BASE/health"              "gateway/health"
          wait_for "$BASE/api/bookings/health" "book service"
          wait_for "$BASE/api/users/health"    "user service"
          wait_for "$BASE/api/search/health"   "search service"

      - name: Smoke tests — health endpoints
        id: smoke
        run: |
          BASE=${{ secrets.PROD_URL }}
          FAILED=0
          check() {
            echo -n "  → $1 "
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$1")
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ ($STATUS)"
            else
              echo "❌ ($STATUS)"
              FAILED=1
            fi
          }
          check "$BASE/health"
          check "$BASE/api/bookings/health"
          check "$BASE/api/users/health"
          check "$BASE/api/search/health"

          if [[ "$FAILED" == "1" ]]; then
            echo "passed=false" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ One or more smoke checks failed — rollback will trigger"
            exit 1
          fi
          echo "passed=true" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ All smoke tests passed"

  # ─────────────────────────────────────────────────────────────────
  # 6. AUTO-ROLLBACK  [DEVOPS OWNS]
  #    Fires ONLY when smoke tests fail.
  #    Reverts gitops/environments/production/values.yaml
  #    to the snapshot taken before this deploy.
  # ─────────────────────────────────────────────────────────────────
  auto-rollback:
    name: AUTO-ROLLBACK — revert prod to previous stable
    runs-on: ubuntu-latest
    needs: [post-deploy-prod, snapshot-current-prod, validate-staging-sha]
    if: failure() && needs.post-deploy-prod.outputs.smoke_passed == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Restore previous prod tags
        run: |
          FILE=gitops/environments/production/values.yaml
          PREV='${{ needs.snapshot-current-prod.outputs.previous_tags }}'

          echo "  Rolling back to previous tags:"
          echo "$PREV" | jq .

          BOOK_TAG=$(echo "$PREV"     | jq -r '.book')
          FRONTEND_TAG=$(echo "$PREV" | jq -r '.frontend')
          SEARCH_TAG=$(echo "$PREV"   | jq -r '.search')
          USER_TAG=$(echo "$PREV"     | jq -r '.user')

          yq -i ".book.tag     = \"$BOOK_TAG\""     $FILE
          yq -i ".frontend.tag = \"$FRONTEND_TAG\"" $FILE
          yq -i ".search.tag   = \"$SEARCH_TAG\""   $FILE
          yq -i ".user.tag     = \"$USER_TAG\""     $FILE

      - name: Commit & Push rollback
        run: |
          FAILED_TAG="${{ needs.validate-staging-sha.outputs.prod_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/production/values.yaml
          git diff --staged --quiet && echo "Nothing to roll back" && exit 0
          git commit -m "gitops(prod): ROLLBACK — smoke failed for $FAILED_TAG [skip ci]"
          git pull --rebase origin main
          git push

      - name: Log rollback summary
        run: |
          echo "🔁 Rollback complete."
          echo "  Failed deploy : ${{ needs.validate-staging-sha.outputs.prod_tag }}"
          echo "  Reverted to   : ${{ needs.snapshot-current-prod.outputs.previous_tags }}"

  # ─────────────────────────────────────────────────────────────────
  # 7. NOTIFY  [DEVOPS OWNS]
  #    Always runs — reports success or failure + rollback to Slack
  #    Requires secret: SLACK_WEBHOOK_URL
  # ─────────────────────────────────────────────────────────────────
  notify:
    name: Notify — Slack
    runs-on: ubuntu-latest
    needs: [post-deploy-prod, auto-rollback, validate-staging-sha]
    if: always()
    steps:
      - name: Determine deploy outcome
        id: outcome
        run: |
          SMOKE="${{ needs.post-deploy-prod.result }}"
          ROLLBACK="${{ needs.auto-rollback.result }}"
          PROD_TAG="${{ needs.validate-staging-sha.outputs.prod_tag }}"

          if [[ "$SMOKE" == "success" ]]; then
            echo "color=#36a64f"  >> $GITHUB_OUTPUT
            echo "title=✅ Production deploy succeeded — $PROD_TAG" >> $GITHUB_OUTPUT
          elif [[ "$ROLLBACK" == "success" ]]; then
            echo "color=#ff9900"      >> $GITHUB_OUTPUT
            echo "title=🔁 Production deploy FAILED + rolled back — $PROD_TAG" >> $GITHUB_OUTPUT
          else
            echo "color=#e01e5a"    >> $GITHUB_OUTPUT
            echo "title=🚨 Production deploy FAILED — $PROD_TAG — MANUAL ACTION NEEDED" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.outcome.outputs.color }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ steps.outcome.outputs.title }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Tag promoted:*\n`${{ github.event.inputs.staging_sha }}` → `${{ needs.validate-staging-sha.outputs.prod_tag }}`" },
                        { "type": "mrkdwn", "text": "*Services:*\n`${{ github.event.inputs.services }}`" },
                        { "type": "mrkdwn", "text": "*Approved by:*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Release notes:*\n${{ github.event.inputs.release_notes }}" }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": { "type": "plain_text", "text": "View Run" },
                          "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK