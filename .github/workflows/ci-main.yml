name: Main Branch CI — Production

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'gitops/**'

  pull_request:
    branches:
      - main             # PR from release/** → main (or hotfix/** → main)
    paths:
      - 'services/**'
      - 'gitops/**'

permissions:
  id-token: write
  contents: write
  security-events: write

concurrency:
  group: main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel a production deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ARGOCD_VERSION: v2.11.3

# ═══════════════════════════════════════════════════════════════════
#  MAIN BRANCH PIPELINE — PRODUCTION
#  ──────────────────────────────────────────────────────────────────
#  WHEN pull_request → main  (from release/** or hotfix/**):
#    → pr-validation (secret scan + lint + unit + SAST PR decoration)
#    → NO build, NO deploy
#    → blocks merge on failure
#
#  WHEN push to main  (after PR merge):
#    → secret scan → detect changes → sonarqube → trivy-iac
#    → build & push (all security checks BLOCKING)
#    → prod approval gate
#    → gitops update (prod)
#    → post-deploy prod (smoke + synthetic monitoring + git tag)
#
#  NOTE: All Trivy exit codes are 1 (blocking) on main — unlike dev/staging.
# ═══════════════════════════════════════════════════════════════════

jobs:

  # ─────────────────────────────────────────────────────────────────
  # PR VALIDATION — release/** (or hotfix/**) → main
  #    Runs ONLY on pull_request. Blocks merge on failure.
  # ─────────────────────────────────────────────────────────────────
  pr-validation:
    name: PR Validation (→ main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Lint Dockerfiles (Hadolint)
        run: |
          for svc in book frontend search user; do
            [ -f services/$svc/Dockerfile ] || continue
            echo "==> Linting services/$svc/Dockerfile"
            docker run --rm -i hadolint/hadolint \
              hadolint --failure-threshold warning - \
              < services/$svc/Dockerfile
          done

      - name: Unit tests
        run: |
          set -e
          for svc in book user search; do
            echo "==> $svc unit tests"
            cd services/$svc
            pytest tests/unit/ -v --tb=short 2>/dev/null \
              || echo "⚠️  PENDING: $svc has no unit tests — add services/$svc/tests/unit/"
            cd $GITHUB_WORKSPACE
          done
          echo "==> frontend unit tests"
          cd services/frontend && npm run test:unit 2>/dev/null \
            || echo "⚠️  PENDING: frontend has no unit tests — add test:unit script"

      # SonarQube PR decoration — posts inline comments on the PR
      - name: SonarQube SAST (PR decoration)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Surendra_Pandrinki_microservices-gitops-platform
            -Dsonar.organization=surendrakumar17
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/vendor/**
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  # ─────────────────────────────────────────────────────────────────
  # 0. COMPUTE TAGS  [DEVOPS OWNS]
  #    Runs ONLY on push. tag=prod-{sha}, deploy_env=prod
  # ─────────────────────────────────────────────────────────────────
  compute-tags:
    name: Compute image tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.set.outputs.tag }}
      deploy_env: ${{ steps.set.outputs.deploy_env }}
    steps:
      - id: set
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-8)
          echo "tag=prod-${SHA}"  >> $GITHUB_OUTPUT
          echo "deploy_env=prod"  >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────
  # 1. SECRET SCAN  [DEVOPS OWNS]  — BLOCKING
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog) — BLOCKING
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────────
  # 2. DETECT CHANGES  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      book:     ${{ steps.filter.outputs.book }}
      frontend: ${{ steps.filter.outputs.frontend }}
      search:   ${{ steps.filter.outputs.search }}
      user:     ${{ steps.filter.outputs.user }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            book:     ['services/book/**']
            frontend: ['services/frontend/**']
            search:   ['services/search/**']
            user:     ['services/user/**']

  # ─────────────────────────────────────────────────────────────────
  # 3. SONARQUBE SAST  [DEVOPS OWNS]  — BLOCKING
  # ─────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube SAST — BLOCKING
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Surendra_Pandrinki_microservices-gitops-platform
            -Dsonar.organization=surendrakumar17
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/vendor/**
            -Dsonar.branch.name=main

  # ─────────────────────────────────────────────────────────────────
  # 4. TRIVY IaC SCAN  [DEVOPS OWNS]  — BLOCKING on main
  # ─────────────────────────────────────────────────────────────────
  trivy-iac:
    name: Trivy — IaC / Helm / Terraform — BLOCKING
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — IaC config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: gitops/
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'       # BLOCKING on main

      - name: Upload IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ─────────────────────────────────────────────────────────────────
  # 5. BUILD & PUSH  [DEVOPS OWNS]  — Trivy BLOCKING on main
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build & Push — ${{ matrix.service }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [detect-changes, compute-tags, secret-scan]
    strategy:
      fail-fast: false
      matrix:
        service: [book, frontend, search, user]
    steps:
      - uses: actions/checkout@v4

      - name: Check if service changed
        id: check
        run: |
          case "${{ matrix.service }}" in
            book)     echo "changed=${{ needs.detect-changes.outputs.book }}"     >> $GITHUB_OUTPUT ;;
            frontend) echo "changed=${{ needs.detect-changes.outputs.frontend }}" >> $GITHUB_OUTPUT ;;
            search)   echo "changed=${{ needs.detect-changes.outputs.search }}"   >> $GITHUB_OUTPUT ;;
            user)     echo "changed=${{ needs.detect-changes.outputs.user }}"     >> $GITHUB_OUTPUT ;;
          esac
          [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && echo "changed=true" >> $GITHUB_OUTPUT

      - name: Configure AWS (OIDC)
        if: steps.check.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635457411372:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.check.outputs.changed == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        if: steps.check.outputs.changed == 'true'
        run: |
          TAG=${{ needs.compute-tags.outputs.tag }}
          docker build \
            --label "git.sha=$GITHUB_SHA" \
            --label "git.branch=main" \
            -t $ECR_REGISTRY/${{ matrix.service }}:${TAG} \
            -t $ECR_REGISTRY/${{ matrix.service }}:latest-prod \
            ./services/${{ matrix.service }}
          docker push $ECR_REGISTRY/${{ matrix.service }}:${TAG}
          docker push $ECR_REGISTRY/${{ matrix.service }}:latest-prod

      - name: Trivy — table output (debug)
        if: steps.check.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ needs.compute-tags.outputs.tag }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Trivy — image vulnerability scan (BLOCKING)
        if: steps.check.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ needs.compute-tags.outputs.tag }}
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'       # BLOCKING on main
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: steps.check.outputs.changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}-${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────
  # 6. PROD APPROVAL GATE  [DEVOPS OWNS]
  #    Pipeline pauses here until a human approves.
  #    Configure: Settings → Environments → production → required reviewers
  # ─────────────────────────────────────────────────────────────────
  prod-approval:
    name: "🔒 Production approval gate"
    runs-on: ubuntu-latest
    needs: [build, sonarqube, trivy-iac]
    if: |
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    environment:
      name: production
    steps:
      - name: Approval confirmed
        run: |
          echo "✅ Production deployment approved"
          echo "   ArgoCD will sync → canary / blue-green rollout"

  # ─────────────────────────────────────────────────────────────────
  # 7. GITOPS UPDATE  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  gitops-update:
    name: GitOps — update prod image tags
    runs-on: ubuntu-latest
    needs: [build, detect-changes, sonarqube, compute-tags, prod-approval]
    if: |
      github.event_name == 'push' &&
      needs.prod-approval.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps values (prod)
        run: |
          FILE=gitops/environments/prod/values.yaml
          TAG=${{ needs.compute-tags.outputs.tag }}
          update() {
            SERVICE=$1; CHANGED=$2
            if [[ "$CHANGED" == "true" ]]; then
              echo "  ↳ $SERVICE → $TAG"
              yq -i ".$SERVICE.tag = \"$TAG\"" $FILE
            fi
          }
          update frontend "${{ needs.detect-changes.outputs.frontend }}"
          update book     "${{ needs.detect-changes.outputs.book }}"
          update search   "${{ needs.detect-changes.outputs.search }}"
          update user     "${{ needs.detect-changes.outputs.user }}"

      - name: Commit & Push
        run: |
          TAG=${{ needs.compute-tags.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/prod/values.yaml
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "gitops(prod): bump image tags → $TAG [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────────
  # 8. POST-DEPLOY: PROD  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  post-deploy-prod:
    name: Prod — smoke + synthetic monitoring
    runs-on: ubuntu-latest
    needs: [gitops-update]
    if: |
      github.event_name == 'push' &&
      needs.gitops-update.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Cache ArgoCD CLI
        id: cache-argocd
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/argocd
          key: argocd-${{ env.ARGOCD_VERSION }}

      - name: Install ArgoCD CLI
        if: steps.cache-argocd.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Wait for ArgoCD sync (prod)
        run: |
          argocd app wait bookstore-prod \
            --health --timeout 300 \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure

      # ── SMOKE TESTS  [DEVOPS OWNS] ───────────────────────────────
      - name: Smoke tests — prod health check
        run: |
          BASE=${{ secrets.PROD_URL }}
          check() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$1")
            [[ "$STATUS" == "200" ]] && echo "  ✅ $1" || (echo "  ❌ $1 ($STATUS)" && exit 1)
          }
          check "$BASE/health"
          check "$BASE/api/books/health"
          check "$BASE/api/users/health"
          check "$BASE/api/search/health"

      # ── SYNTHETIC MONITORING  [DEVOPS OWNS] ──────────────────────
      - name: Synthetic monitoring — critical user paths
        run: |
          BASE=${{ secrets.PROD_URL }}

          echo "  → Homepage loads"
          curl -sf --max-time 5 "$BASE/" > /dev/null \
            && echo "  ✅ homepage" || (echo "  ❌ homepage" && exit 1)

          echo "  → Book listing API"
          curl -sf --max-time 5 "$BASE/api/books?limit=1" > /dev/null \
            && echo "  ✅ book listing" || (echo "  ❌ book listing" && exit 1)

          echo "  → Search API"
          curl -sf --max-time 5 "$BASE/api/search?q=test" > /dev/null \
            && echo "  ✅ search" || (echo "  ❌ search" && exit 1)

          # TODO (DevOps): replace with Datadog synthetic API trigger:
          # curl -X POST "https://api.datadoghq.com/api/v1/synthetics/tests/trigger/ci" \
          #   -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
          #   -d '{"tests": [{"public_id": "abc-def-ghi"}]}'

      # ── RELEASE TAGGING  [DEVOPS OWNS] ───────────────────────────
      - name: Tag release in Git
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-8)
          TAG="release-$(date +%Y%m%d)-${SHA}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production release $TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"

      - name: Prod deploy summary
        run: |
          echo "════════════════════════════════════════"
          echo "  PROD DEPLOY COMPLETE ✅"
          echo "  ✅ Secret scan          (BLOCKING)"
          echo "  ✅ SonarQube SAST       (BLOCKING)"
          echo "  ✅ Trivy image scan     (BLOCKING)"
          echo "  ✅ Trivy IaC scan       (BLOCKING)"
          echo "  ✅ Prod approval gate"
          echo "  ✅ Smoke tests"
          echo "  ✅ Synthetic monitoring"
          echo "  ✅ Git release tag"
          echo "════════════════════════════════════════"

# ═══════════════════════════════════════════════════════════════════
#  TRIGGER SUMMARY
#  ──────────────────────────────────────────────────────────────────
#  PR → main       → pr-validation only (blocks merge on failure)
#  push to main    → full prod pipeline (all checks BLOCKING)
#
#  REQUIRED SETUP
#    Settings → Branches → main → Require status checks
#    → add "PR Validation (→ main)" as required check
#    Settings → Environments → production → required reviewers
#
#  SECRETS REQUIRED
#    ECR_REGISTRY, ARGOCD_SERVER, ARGOCD_TOKEN
#    PROD_URL, SONAR_TOKEN, SONAR_HOST_URL
# ═══════════════════════════════════════════════════════════════════