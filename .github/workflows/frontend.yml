name: frontend-ci

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'services/frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/frontend/**'
  workflow_dispatch:   # allows manual trigger, mirrors GitLab's "if source == web"

jobs:
  ci:
    uses: ./.github/workflows/_reusable-node-ci.yml
    with:
      service-name: frontend
      service-path: services/frontend
      ecr-registry: ${{ vars.ECR_REGISTRY }}        # set in Repo Settings -> Variables
      sonar-project-key: skybook-frontend
      gitops-repo: skybook-org/skybook-gitops        # replace skybook-org with your actual org
      target-env: staging
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}