name: payment-service-ci

on:
  push:
    branches: [develop]
    paths:
      - 'services/payment-service/**'
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    uses: ./.github/workflows/_reusable-go-ci.yml
    with:
      service-name: payment-service
      values-key: payment
      service-path: services/payment-service
      ecr-registry: ${{ vars.ECR_REGISTRY }}
      sonar-project-key: SurendraKumar17_Production-Grade-Microservices-on-Kubernetes
      gitops-repo: SurendraKumar17/microservices-cd-platform
      target-env: dev
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
