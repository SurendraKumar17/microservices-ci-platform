name: Release Branch CI

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'services/**'
      - 'gitops/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main             # PR from release/** → main triggers PR validation
    paths:
      - 'services/**'
      - 'gitops/**'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Force deploy to staging'
        required: true
        default: 'staging'
        type: choice
        options: [staging]

permissions:
  id-token: write
  contents: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel an active staging deploy

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ARGOCD_VERSION: v2.11.3

# ═══════════════════════════════════════════════════════════════════
#  RELEASE BRANCH PIPELINE
#  ──────────────────────────────────────────────────────────────────
#  WHEN pull_request release/** → main:
#    → pr-validation (secret scan + lint + unit + SAST PR decoration)
#    → NO build, NO deploy
#    → blocks merge on failure
#
#  WHEN push to release/**:
#    → secret scan → detect changes → sonarqube → trivy-iac
#    → build & push (staging-{sha} tag + latest-staging)
#    → gitops update (staging)
#    → post-deploy staging (wait → smoke → integration → E2E → perf → ZAP)
#    → qa-approval gate
#
#  OWNERSHIP
#  [DEVOPS OWNS]  All job wiring, ECR, ArgoCD sync, smoke, k6, ZAP
#  [DEV OWNS]     services/{svc}/tests/unit/, tests/integration/, tests/e2e/
# ═══════════════════════════════════════════════════════════════════

jobs:

  # ─────────────────────────────────────────────────────────────────
  # PR VALIDATION — release/** → main
  #    Runs ONLY on pull_request. Blocks merge on failure.
  # ─────────────────────────────────────────────────────────────────
  pr-validation:
    name: PR Validation (release → main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Lint Dockerfiles (Hadolint)
        run: |
          for svc in book frontend search user; do
            [ -f services/$svc/Dockerfile ] || continue
            echo "==> Linting services/$svc/Dockerfile"
            docker run --rm -i hadolint/hadolint \
              hadolint --failure-threshold warning - \
              < services/$svc/Dockerfile
          done

      - name: Unit tests
        run: |
          set -e
          for svc in book user search; do
            echo "==> $svc unit tests"
            cd services/$svc
            pytest tests/unit/ -v --tb=short 2>/dev/null \
              || echo "⚠️  PENDING: $svc has no unit tests — add services/$svc/tests/unit/"
            cd $GITHUB_WORKSPACE
          done
          echo "==> frontend unit tests"
          cd services/frontend && npm run test:unit 2>/dev/null \
            || echo "⚠️  PENDING: frontend has no unit tests — add test:unit script"

      - name: SonarQube SAST (PR decoration)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Surendra_Pandrinki_microservices-gitops-platform
            -Dsonar.organization=surendrakumar17
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/vendor/**
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  # ─────────────────────────────────────────────────────────────────
  # 0. COMPUTE TAGS  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  compute-tags:
    name: Compute image tag
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.set.outputs.tag }}
      deploy_env: ${{ steps.set.outputs.deploy_env }}
    steps:
      - id: set
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-8)
          echo "tag=staging-${SHA}"  >> $GITHUB_OUTPUT
          echo "deploy_env=staging"  >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────
  # 1. SECRET SCAN  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────────
  # 2. DETECT CHANGES  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      book:     ${{ steps.filter.outputs.book }}
      frontend: ${{ steps.filter.outputs.frontend }}
      search:   ${{ steps.filter.outputs.search }}
      user:     ${{ steps.filter.outputs.user }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            book:     ['services/book/**']
            frontend: ['services/frontend/**']
            search:   ['services/search/**']
            user:     ['services/user/**']

  # ─────────────────────────────────────────────────────────────────
  # 3. SONARQUBE SAST  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube SAST (branch scan)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Surendra_Pandrinki_microservices-gitops-platform
            -Dsonar.organization=surendrakumar17
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/vendor/**
            -Dsonar.branch.name=${{ github.ref_name }}

  # ─────────────────────────────────────────────────────────────────
  # 4. BUILD & PUSH  [DEVOPS OWNS]
  #    SHA tag + latest-staging (ECR mutable — staging only)
  #    Trivy exit-code=0 on staging (warn only)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build & Push — ${{ matrix.service }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [detect-changes, compute-tags, secret-scan]
    strategy:
      fail-fast: false
      matrix:
        service: [book, frontend, search, user]
    steps:
      - uses: actions/checkout@v4

      - name: Check if service changed
        id: check
        run: |
          set -eo pipefail

          SERVICE="${{ matrix.service }}"

          if [ "$SERVICE" == "book" ]; then
            CHANGED="${{ needs.detect-changes.outputs.book }}"
          elif [ "$SERVICE" = "frontend" ]; then
            CHANGED="${{ needs.detect-changes.outputs.frontend }}"
          elif [ "$SERVICE" = "search" ]; then
            CHANGED="${{ needs.detect-changes.outputs.search }}"
          elif [ "$SERVICE" = "user" ]; then
            CHANGED="${{ needs.detect-changes.outputs.user }}"
          else
            CHANGED="false"
          fi

          if [ -z "$CHANGED" ]; then
            CHANGED="false"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="true"
          fi

          echo "SERVICE=$SERVICE"
          echo "CHANGED=$CHANGED"
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Configure AWS (OIDC)
        if: steps.check.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::635457411372:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.check.outputs.changed == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push image
        if: steps.check.outputs.changed == 'true'
        run: |
          TAG=${{ needs.compute-tags.outputs.tag }}
          docker build \
            --label "git.sha=$GITHUB_SHA" \
            --label "git.branch=${GITHUB_REF##*/}" \
            -t $ECR_REGISTRY/${{ matrix.service }}:${TAG} \
            -t $ECR_REGISTRY/${{ matrix.service }}:latest-staging \
            ./services/${{ matrix.service }}
          docker push $ECR_REGISTRY/${{ matrix.service }}:${TAG}
          docker push $ECR_REGISTRY/${{ matrix.service }}:latest-staging

      - name: Trivy — table output (debug)
        if: steps.check.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ needs.compute-tags.outputs.tag }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          scanners: vuln,secret

      - name: Trivy — SARIF (warn only on staging)
        if: steps.check.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ needs.compute-tags.outputs.tag }}
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: steps.check.outputs.changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}-${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────
  # 5. TRIVY IaC SCAN  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  trivy-iac:
    name: Trivy — IaC / Helm scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — IaC config scan (warn on staging)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: gitops/
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Upload IaC SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ─────────────────────────────────────────────────────────────────
  # 6. GITOPS UPDATE  [DEVOPS OWNS]
  # ─────────────────────────────────────────────────────────────────
  gitops-update:
    name: GitOps — update staging image tags
    runs-on: ubuntu-latest
    needs: [build, detect-changes, sonarqube, trivy-iac, compute-tags]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps values (staging)
        run: |
          FILE=gitops/environments/staging/values.yaml
          TAG=${{ needs.compute-tags.outputs.tag }}
          update() {
            SERVICE=$1; CHANGED=$2
            if [[ "$CHANGED" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "  ↳ $SERVICE → $TAG"
              yq -i ".$SERVICE.tag = \"$TAG\"" $FILE
            fi
          }
          update frontend "${{ needs.detect-changes.outputs.frontend }}"
          update book     "${{ needs.detect-changes.outputs.book }}"
          update search   "${{ needs.detect-changes.outputs.search }}"
          update user     "${{ needs.detect-changes.outputs.user }}"

      - name: Commit & Push
        run: |
          TAG=${{ needs.compute-tags.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/environments/staging/values.yaml
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "gitops(staging): bump image tags → $TAG [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────────
  # 7. POST-DEPLOY: STAGING  [FULL TEST SUITE]
  # ─────────────────────────────────────────────────────────────────
  post-deploy-staging:
    name: Staging — post-deploy tests
    runs-on: ubuntu-latest
    needs: [gitops-update]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.gitops-update.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Cache ArgoCD CLI
        id: cache-argocd
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/argocd
          key: argocd-${{ env.ARGOCD_VERSION }}

      - name: Install ArgoCD CLI
        if: steps.cache-argocd.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/${{ env.ARGOCD_VERSION }}/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Wait for ArgoCD sync (staging)
        run: |
          argocd app wait bookstore-staging \
            --health --timeout 300 \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --insecure

      - name: Wait for services to be healthy
        run: |
          BASE=${{ secrets.STAGING_URL }}
          wait_for() {
            local URL=$1
            local NAME=$2
            local RETRIES=12
            local WAIT=10
            echo "  Waiting for $NAME..."
            for i in $(seq 1 $RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
              if [[ "$STATUS" == "200" ]]; then
                echo "  ✅ $NAME is healthy ($STATUS)"
                return 0
              fi
              echo "  ⏳ $NAME not ready yet ($STATUS) — attempt $i/$RETRIES, retrying in ${WAIT}s..."
              sleep $WAIT
            done
            echo "  ❌ $NAME failed to become healthy after $((RETRIES * WAIT))s"
            return 1
          }
          wait_for "$BASE/health"              "gateway/health"
          wait_for "$BASE/api/bookings/health" "book service"
          wait_for "$BASE/api/users/health"    "user service"
          wait_for "$BASE/api/search/health"   "search service"

      # ── SMOKE TESTS  [DEVOPS OWNS] ───────────────────────────────
      - name: Smoke tests — health endpoints
        run: |
          BASE=${{ secrets.STAGING_URL }}
          check() {
            echo -n "  → $1 "
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$1")
            [[ "$STATUS" == "200" ]] && echo "✅ ($STATUS)" || (echo "❌ ($STATUS)" && exit 1)
          }
          check "$BASE/health"
          check "$BASE/api/bookings/health"
          check "$BASE/api/users/health"
          check "$BASE/api/search/health"

      # ── INTEGRATION TESTS  [SHARED] ──────────────────────────────
      - name: Install Python test dependencies
        run: pip install pytest requests --quiet

      - name: Integration tests
        run: |
          BASE=${{ secrets.STAGING_URL }}
          echo "  → bookings API raw response:"
          BOOKINGS_RESPONSE=$(curl -s --max-time 10 "$BASE/api/bookings")
          echo "  $BOOKINGS_RESPONSE"
          echo "$BOOKINGS_RESPONSE" | grep -q '"bookings"' \
            && echo "  ✅ bookings API responding" \
            || (echo "  ❌ bookings API not returning expected shape" && exit 1)
          echo "  → search service reachable"
          curl -sf "$BASE/api/search?q=test" \
            && echo "  ✅ search API reachable" \
            || (echo "  ❌ search API not reachable" && exit 1)
          pytest tests/integration/ --base-url=$BASE -v --tb=short \
            --junit-xml=reports/integration-staging.xml

      # ── E2E TESTS  [SHARED] ──────────────────────────────────────
      - name: Install Playwright + browser deps
        run: |
          npm install -g @playwright/test
          npx playwright install --with-deps chromium firefox webkit

      - name: E2E tests (Playwright)
        run: |
          npx playwright test \
            --project=chromium --project=firefox \
            --reporter=html --output=reports/playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: reports/playwright/
          if-no-files-found: ignore

      # ── PERFORMANCE TESTS  [DEVOPS OWNS] ────────────────────────
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Performance tests (k6) — smoke
        run: |
          k6 run tests/performance/staging-smoke.js \
            --env BASE_URL=${{ secrets.STAGING_URL }} \
            --out json=reports/k6-smoke.json \
            --summary-trend-stats="avg,p(95),p(99)"

      - name: Performance tests (k6) — load
        run: |
          k6 run tests/performance/staging-load.js \
            --env BASE_URL=${{ secrets.STAGING_URL }} \
            --out json=reports/k6-load.json

      # ── OWASP ZAP DAST  [DEVOPS OWNS] ───────────────────────────
      - name: OWASP ZAP — DAST baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j'
          fail_action: warn

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-staging-report
          path: report_html.html

      - name: Staging test summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "  STAGING POST-DEPLOY COMPLETE"
          echo "  ✅ Smoke tests"
          echo "  ✅ Integration tests"
          echo "  ✅ E2E tests (Playwright)"
          echo "  ✅ Performance tests (k6 smoke + load)"
          echo "  ✅ OWASP ZAP DAST"
          echo "  ⏳ Awaiting manual QA sign-off"
          echo "════════════════════════════════════════"

  # ─────────────────────────────────────────────────────────────────
  # 8. MANUAL QA GATE  [DEVOPS OWNS]
  #    Configure: Settings → Environments → staging → required reviewers
  # ─────────────────────────────────────────────────────────────────
  qa-approval:
    name: "⏳ Manual QA sign-off (staging)"
    runs-on: ubuntu-latest
    needs: [post-deploy-staging]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.post-deploy-staging.result == 'success'
    environment:
      name: staging
    steps:
      - name: QA gate passed
        run: |
          echo "✅ QA sign-off complete — release approved to merge to main"

# ═══════════════════════════════════════════════════════════════════
#  TRIGGER SUMMARY
#  ──────────────────────────────────────────────────────────────────
#  PR release/** → main     → pr-validation only (blocks merge)
#  push to release/**       → full build + staging deploy + tests
#                             + QA gate
#
#  SECRETS REQUIRED
#    ECR_REGISTRY, ARGOCD_SERVER, ARGOCD_TOKEN
#    STAGING_URL, SONAR_TOKEN, SONAR_HOST_URL
#
#  REQUIRED GITHUB SETUP
#    Settings → Environments → staging → add required reviewers
#    Settings → Branches → main → require status check:
#      "PR Validation (release → main)"
# ═══════════════════════════════════════════════════════════════════