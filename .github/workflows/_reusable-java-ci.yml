#
#  REUSABLE JAVA (SPRING BOOT) CI TEMPLATE
#  Used by: booking-service
#  Mirrors GitLab stages: validate -> scan -> sast -> build -> sign
#
name: _reusable-java-ci

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      values-key:
        description: 'Key name in values.yaml (may differ from service-name)'
        required: false
        type: string
        default: ''
      service-path:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: us-east-1
      ecr-registry:
        required: true
        type: string
      sonar-project-key:
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE_ARN:
        required: true
      SONAR_TOKEN:
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  # ── STAGE: validate ──────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect if this service changed
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manually triggered -> treating as changed"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No previous SHA (new branch) -> treating as changed"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q "^${{ inputs.service-path }}/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${{ inputs.service-path }} changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${{ inputs.service-path }} unchanged - skipping"
          fi

      - name: Secret scan (TruffleHog)
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog git "file://${{ github.workspace }}" \
            --since-commit "${{ github.event.before }}" \
            --branch "${{ github.ref_name }}" \
            --only-verified \
            --fail

      - name: Setup Java (Temurin 21)
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service-path }}/pom.xml

      - name: Lint Dockerfile (Hadolint)
        if: steps.detect.outputs.changed == 'true'
        run: |
          docker run --rm -i hadolint/hadolint \
            hadolint --failure-threshold warning - < Dockerfile

      - name: Unit tests with coverage (Maven + JaCoCo)
        if: steps.detect.outputs.changed == 'true'
        run: mvn test jacoco:report -q
        continue-on-error: true

      - name: Maven build (compile + package, skip tests - already ran above)
        if: steps.detect.outputs.changed == 'true'
        run: mvn clean package -DskipTests -q

      - name: Upload build output
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maven-target-${{ inputs.service-name }}
          path: ${{ inputs.service-path }}/target
          retention-days: 1

  # ── STAGE: scan (SCA - dependency vulnerabilities) ──────────────
  sca-scan:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service-path }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Grype dependency scan (Maven deps)
        run: grype dir:. --fail-on critical -o table

  # ── STAGE: sast ──────────────────────────────────────────────────
  sonarqube:
    needs: validate
    if: needs.validate.outputs.changed == 'true' && inputs.sonar-project-key != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download compiled classes from validate job
        uses: actions/download-artifact@v4
        with:
          name: maven-target-${{ inputs.service-name }}
          path: ${{ inputs.service-path }}/target

      - name: Unit tests with coverage (Maven + JaCoCo)
        working-directory: ${{ inputs.service-path }}
        run: mvn test jacoco:report -q
        continue-on-error: true

      - name: SonarQube Scan
        working-directory: ${{ inputs.service-path }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
            -Dsonar.organization=surendrakumar17 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # ── STAGE: build (docker build, push, image scan, SBOM) ─────────
  build:
    needs: [validate, sca-scan]
    if: needs.validate.outputs.changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled jar from validate job
        uses: actions/download-artifact@v4
        with:
          name: maven-target-${{ inputs.service-name }}
          path: ${{ inputs.service-path }}/target

      - name: Compute image tag
        id: tag
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "tag=${{ github.ref_name }}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        working-directory: ${{ inputs.service-path }}
        run: |
          docker build \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "build.author=${{ github.actor }}" \
            --label "build.run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -t ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ steps.tag.outputs.tag }} \
            .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ steps.tag.outputs.tag }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          scanners: 'vuln,secret'

      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ steps.tag.outputs.tag }}
          format: cyclonedx-json
          output-file: sbom-${{ inputs.service-name }}.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service-name }}
          path: sbom-${{ inputs.service-name }}.json
          retention-days: 30

      - name: Push image
        run: docker push ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ steps.tag.outputs.tag }}

  # ── STAGE: sign ───────────────────────────────────────────────────
  sign-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ needs.build.outputs.image-tag }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ inputs.ecr-registry }}/${{ inputs.service-name }}:${{ needs.build.outputs.image-tag }}