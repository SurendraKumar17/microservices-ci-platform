name: Feature + PR CI

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'services/**'
      - 'gitops/**'

  pull_request:
    branches:
      - develop
    paths:
      - 'services/**'
      - 'gitops/**'

permissions:
  id-token: write
  contents: write
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ARGOCD_VERSION: v2.11.3

jobs:

  # ─────────────────────────────────────────────────────────────────
  # PR VALIDATION (UNCHANGED FROM YOUR PIPELINE)
  # ─────────────────────────────────────────────────────────────────
  pr-validation:
    name: PR Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Lint Dockerfiles (Hadolint)
        run: |
          for svc in book frontend search user; do
            [ -f services/$svc/Dockerfile ] || continue
            docker run --rm -i hadolint/hadolint \
              hadolint --failure-threshold warning - \
              < services/$svc/Dockerfile
          done

      - name: Unit tests
        run: |
          set -e
          echo "==> book unit tests"
          cd services/book && pytest tests/unit/ -v --tb=short 2>/dev/null \
            || echo "⚠️  PENDING: No unit tests found for book"
          cd $GITHUB_WORKSPACE

          echo "==> user unit tests"
          cd services/user && pytest tests/unit/ -v --tb=short 2>/dev/null \
            || echo "⚠️  PENDING: No unit tests found for user"
          cd $GITHUB_WORKSPACE

          echo "==> search unit tests"
          cd services/search && pytest tests/unit/ -v --tb=short 2>/dev/null \
            || echo "⚠️  PENDING: No unit tests found for search"
          cd $GITHUB_WORKSPACE

          echo "==> frontend unit tests"
          cd services/frontend && npm run test:unit 2>/dev/null \
            || echo "⚠️  PENDING: No unit tests found for frontend"

      - name: SonarQube SAST (PR decoration)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Surendra_Pandrinki_microservices-gitops-platform
            -Dsonar.organization=surendrakumar17
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/vendor/**
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}

  # ─────────────────────────────────────────────────────────────────
  # FEATURE CHECKS (UNCHANGED FROM YOUR PIPELINE)
  # ─────────────────────────────────────────────────────────────────
  feature-checks:
    name: Feature — lint + secrets + unit + SAST
    if: github.event_name == 'push' &&
        startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

      - name: Lint Dockerfiles (Hadolint)
        run: |
          for svc in book frontend search user; do
            [ -f services/$svc/Dockerfile ] || continue
            docker run --rm -i hadolint/hadolint \
              hadolint --failure-threshold warning - \
              < services/$svc/Dockerfile
          done

      - name: Unit tests
        run: |
          set -e
          for svc in book user search; do
            cd services/$svc
            pytest tests/unit/ -v --tb=short 2>/dev/null \
              || echo "⚠️  PENDING: $svc has no unit tests yet"
            cd $GITHUB_WORKSPACE
          done

          cd services/frontend && npm run test:unit 2>/dev/null \
            || echo "⚠️  PENDING: frontend has no unit tests yet"

      - name: SonarQube SAST (feature branch scan)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Surendra_Pandrinki_microservices-gitops-platform
            -Dsonar.organization=surendrakumar17
            -Dsonar.sources=services
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/vendor/**
            -Dsonar.branch.name=${{ github.ref_name }}